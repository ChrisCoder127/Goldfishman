
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>GoldfishMan - Underwater FFA</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="mainMenu">
        <div class="menu-content">
            <div class="logo">GOLDFISH<span>MAN</span></div>
            <p>UNDERWATER FREE-FOR-ALL</p>

            <input id="username" maxlength="16" value="Goldfish"
                placeholder="Fish name">

            <button id="play">ENTER THE ARENA</button>

            <p id="error"></p>
            <small>WASD TO SWIM · MOUSE TO AIM</small>
        </div>
    </div>

    <div id="gameScreen">
        <canvas id="game"></canvas>

        <header class="hud">
            <div class="hud-box">
                <strong id="playerName">GOLDFISH</strong>
                <div class="health-track">
                    <div id="healthBar"></div>
                </div>
                <span id="healthText">100 HP</span>
            </div>

            <div class="hud-box stats">
                <span id="kills">KILLS: 0</span>
                <span id="ammo">AMMO: 12 / 12</span>
            </div>

            <button id="exitGame">EXIT</button>
        </header>

        <div class="inventory" id="inventory">
            <div class="slot selected" data-slot="1">
                <span class="slot-number">1</span>
                <span class="slot-icon">🔫</span>
                <span>GUN</span>
            </div>
            <div class="slot" data-slot="2">
                <span class="slot-number">2</span>
                <span class="slot-icon">✊</span>
                <span>FISTS</span>
            </div>
            <div class="slot" data-slot="3">
                <span class="slot-number">3</span>
                <span class="slot-icon">▦</span>
                <span>BLOCKS</span>
                <small id="blockCount">30</small>
            </div>
        </div>

        <div id="message"></div>
    </div>

    <script src="game.js"></script>
</body>
</html>
