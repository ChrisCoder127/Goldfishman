<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Goldfish Arena</title>
<style>
  :root { --pond:#0e3b43; --deep:#082a30; --gold:#ff8a1f; --cream:#fff1d6; --lily:#7bc47f; --foe:#6fb7ff; }
  * { box-sizing: border-box; }
  html, body { margin:0; height:100%; overflow:hidden; background:var(--deep); color:var(--cream);
    font-family: "Trebuchet MS", "Segoe UI", sans-serif; touch-action:none; }
  canvas { display:block; width:100%; height:100%; }
  #menu { position:fixed; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:14px; background:rgba(8,42,48,.88); padding:20px; text-align:center; }
  h1 { font-size:clamp(2.2rem,8vw,4rem); margin:0; color:var(--gold); letter-spacing:.5px; }
  p { margin:0; max-width:34ch; line-height:1.45; }
  input, button { font:inherit; font-size:1.1rem; padding:12px 16px; border-radius:10px; border:2px solid var(--gold); }
  input { background:var(--pond); color:var(--cream); width:min(280px,80vw); text-align:center; }
  button { background:var(--gold); color:#2a1400; font-weight:700; cursor:pointer; }
  button:focus-visible, input:focus-visible { outline:3px solid var(--cream); outline-offset:2px; }
  #msg { color:#ffb3a0; min-height:1.3em; }
  #board { position:fixed; top:10px; right:10px; background:rgba(8,42,48,.7); border-radius:10px; padding:8px 12px;
    font-size:.9rem; min-width:150px; pointer-events:none; }
  #board b { color:var(--gold); }
  .row { display:flex; justify-content:space-between; gap:12px; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="board" hidden></div>
<div id="menu">
  <h1>Goldfish Arena</h1>
  <p>Swim with WASD, arrow keys, or by dragging. Your fish fires at the nearest rival on its own. Last one afloat scores.</p>
  <input id="name" maxlength="14" placeholder="Your fish name" autocomplete="off">
  <button id="play">Dive in</button>
  <div id="msg"></div>
</div>
<script>
// If the page is hosted somewhere other than the Worker, set this to e.g. "wss://play.goldfishman.com/ws"
const WS_URL = "";

const cv = document.getElementById("c"), ctx = cv.getContext("2d");
const menu = document.getElementById("menu"), board = document.getElementById("board"), msg = document.getElementById("msg");
let ws, myId = null, size = 2400, fish = new Map(), arrows = [], keys = {}, drag = null, lastSent = "";

function resize() { cv.width = innerWidth * devicePixelRatio; cv.height = innerHeight * devicePixelRatio; }
addEventListener("resize", resize); resize();

function connect() {
  const url = WS_URL || `${location.protocol === "https:" ? "wss" : "ws"}://${location.host}/ws`;
  msg.textContent = "Connecting...";
  ws = new WebSocket(url);
  ws.onopen = () => ws.send(JSON.stringify({ t: "join", name: document.getElementById("name").value.trim() || "Goldfish" }));
  ws.onmessage = (e) => {
    const m = JSON.parse(e.data);
    if (m.t === "hi") { myId = m.id; size = m.size; menu.hidden = true; board.hidden = false; }
    else if (m.t === "s") applyState(m);
  };
  ws.onclose = () => { menu.hidden = false; board.hidden = true; msg.textContent = "Disconnected. Press Dive in to rejoin."; myId = null; };
  ws.onerror = () => { msg.textContent = "Can't reach the game server."; };
}
document.getElementById("play").onclick = connect;
document.getElementById("name").addEventListener("keydown", (e) => { if (e.key === "Enter") connect(); });

function applyState(m) {
  const seen = new Set();
  for (const [id, x, y, hp, name, kills, dead] of m.f) {
    seen.add(id);
    const o = fish.get(id);
    if (o) Object.assign(o, { tx: x, ty: y, hp, name, kills, dead });
    else fish.set(id, { x, y, tx: x, ty: y, hp, name, kills, dead, ang: 0 });
  }
  for (const id of fish.keys()) if (!seen.has(id)) fish.delete(id);
  arrows = m.a;
  const top = [...fish.values()].sort((a, b) => b.kills - a.kills).slice(0, 5);
  board.innerHTML = "<b>Top fish</b>" + top.map((f) => `<div class="row"><span>${f.name.replace(/</g, "&lt;")}</span><span>${f.kills}</span></div>`).join("");
}

// input
addEventListener("keydown", (e) => { keys[e.key.toLowerCase()] = true; });
addEventListener("keyup", (e) => { keys[e.key.toLowerCase()] = false; });
cv.addEventListener("pointerdown", (e) => { drag = { x: e.clientX, y: e.clientY, cx: e.clientX, cy: e.clientY }; });
cv.addEventListener("pointermove", (e) => { if (drag) { drag.cx = e.clientX; drag.cy = e.clientY; } });
addEventListener("pointerup", () => { drag = null; });

function sendInput() {
  if (!ws || ws.readyState !== 1 || myId === null) return;
  let x = (keys.d || keys.arrowright ? 1 : 0) - (keys.a || keys.arrowleft ? 1 : 0);
  let y = (keys.s || keys.arrowdown ? 1 : 0) - (keys.w || keys.arrowup ? 1 : 0);
  if (drag) { const dx = drag.cx - drag.x, dy = drag.cy - drag.y, d = Math.hypot(dx, dy); if (d > 8) { x = dx / Math.max(d, 60) * Math.min(d / 60, 1) ; y = dy / Math.max(d, 60) * Math.min(d / 60, 1); } }
  const s = JSON.stringify({ t: "in", x: +x.toFixed(2), y: +y.toFixed(2) });
  if (s !== lastSent) { ws.send(s); lastSent = s; }
}
setInterval(sendInput, 50);

function draw() {
  const W = cv.width, H = cv.height, k = devicePixelRatio;
  ctx.fillStyle = "#082a30"; ctx.fillRect(0, 0, W, H);
  const me = fish.get(myId);
  for (const f of fish.values()) { f.ang = Math.atan2(f.ty - f.y, f.tx - f.x) || f.ang; f.x += (f.tx - f.x) * 0.35; f.y += (f.ty - f.y) * 0.35; }
  const cx = me ? me.x : size / 2, cy = me ? me.y : size / 2;
  ctx.save();
  ctx.translate(W / 2 - cx * k, H / 2 - cy * k); ctx.scale(k, k);
  ctx.fillStyle = "#0e3b43"; ctx.fillRect(0, 0, size, size);
  ctx.strokeStyle = "rgba(123,196,127,.12)"; ctx.lineWidth = 1;
  for (let i = 0; i <= size; i += 100) { ctx.beginPath(); ctx.moveTo(i, 0); ctx.lineTo(i, size); ctx.moveTo(0, i); ctx.lineTo(size, i); ctx.stroke(); }
  ctx.strokeStyle = "#7bc47f"; ctx.lineWidth = 6; ctx.strokeRect(0, 0, size, size);

  for (const a of arrows) {
    ctx.save(); ctx.translate(a[0], a[1]); ctx.rotate(a[2]);
    ctx.strokeStyle = "#fff1d6"; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(-12, 0); ctx.lineTo(10, 0); ctx.stroke();
    ctx.fillStyle = "#fff1d6"; ctx.beginPath(); ctx.moveTo(14, 0); ctx.lineTo(6, -4); ctx.lineTo(6, 4); ctx.fill();
    ctx.restore();
  }
  for (const [id, f] of fish) {
    if (f.dead) continue;
    const mine = id === myId, col = mine ? "#ff8a1f" : "#6fb7ff";
    ctx.save(); ctx.translate(f.x, f.y); ctx.rotate(f.ang);
    ctx.fillStyle = col;
    ctx.beginPath(); ctx.moveTo(-14, 0); ctx.lineTo(-30, -11); ctx.lineTo(-30, 11); ctx.fill();   // tail
    ctx.beginPath(); ctx.ellipse(0, 0, 22, 14, 0, 0, 7); ctx.fill();                               // body
    ctx.fillStyle = "#fff1d6"; ctx.beginPath(); ctx.arc(11, -4, 4, 0, 7); ctx.fill();
    ctx.fillStyle = "#2a1400"; ctx.beginPath(); ctx.arc(12, -4, 2, 0, 7); ctx.fill();
    ctx.restore();
    ctx.fillStyle = "rgba(0,0,0,.5)"; ctx.fillRect(f.x - 24, f.y - 30, 48, 6);
    ctx.fillStyle = f.hp > 40 ? "#7bc47f" : "#ff6a4d"; ctx.fillRect(f.x - 24, f.y - 30, 48 * Math.max(0, f.hp) / 100, 6);
    ctx.fillStyle = "#fff1d6"; ctx.font = "13px Trebuchet MS, sans-serif"; ctx.textAlign = "center"; ctx.fillText(f.name, f.x, f.y - 36);
  }
  ctx.restore();
  if (me && me.dead) { ctx.fillStyle = "#fff1d6"; ctx.font = `${28 * k}px Trebuchet MS, sans-serif`; ctx.textAlign = "center"; ctx.fillText("You got hooked. Respawning...", W / 2, H / 2); }
  requestAnimationFrame(draw);
}
draw();
</script>
</body>
</html>
